[project]
name = "backend-banking-widget"
version = "0.1.0"
description = "Это бэкенд банковского виджете клиента."
authors = [
    {name = "Dmitrii Goldyrev",email = "dharani@mail.ru"}
]
requires-python = ">=3.14"
dependencies = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "mypy (>=1.20.0,<2.0.0)"
]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.black]
# максимальная длина строки
line-length = 119
exclude = '''
(
  /(
    | \.git          # в корне проекта
  )/
)
'''

[tool.isort]
# максимальная длина строки
line_length = 119
multi_line_output = 3

[tool.mypy]
disallow_untyped_defs = true  # запрещает объявлять функции без аннотации типов
warn_return_any = true
exclude = 'venv'